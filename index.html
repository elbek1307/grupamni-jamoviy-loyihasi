<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="header">
     <nav>
        <div class="container">
            <img src="./images/Logo.svg" alt="logo" class="nav_logo">
            <div class="nav_box">
                <img src="./images/log-in.svg" alt="logn" class="nav_logn">
                <img src="./images/cart.svg" alt="cart" class="nav_cart">
                <img src="./images/burger.svg" alt="menu" class="nav_burger">
            </div>
        </container>
     </nav>
    </header>
  <main>
     <div class="hero">
        <div class="container"></div>
        <div class="hero-info">
            <div class="hero-card">
           <div class="hero-left">
            <h1 class="hero-title">Your Food court at home</h1>
            <div class="hero-btns">
                <button class="hero-btn">Delivery <span class="hero-span">Order in</span> </button>
                <button class="hero-btn">Takeout  <span class="hero-span">Grab and go</span> </button>
                
            </div>
           </div>
           <div class="hero-right">
           <img class="hero-taom" src="./images/hero_taom.png" alt="rasm  ">
            <span class="hero-spans">
                <img class="hero-flower" src="./images/hero_flower.png" alt="rasm">
                <span class="right-span"><img class="hero-arrow" src="./images/hero_arrow.png" alt="rasm">Fresh salad, Il Pasifigio</span>
            </span>
           </div>
          </div>
          <ul class="hero-list">
            <li class="hero-item">
                <img src="./images/hero_list1.png" alt="rasm">
                <p class="hero-text">delivery in all paris in less than 30 minutes</p>
            </li>
            <li class="hero-item">
                <img src="./images/hero_list2.png" alt="rasm">
                <p class="hero-text">Free delivery from 29 euros</p>
            </li>
            <li class="hero-item">
                <img src="./images/hero_list3.png" alt="rasm">
                <p class="hero-text">Only fresh and French products</p>
            </li>
            
          </ul>
     </div>
    </div>
  </main>
    


    <script src="./main.js"></script>
</body>
</html>
